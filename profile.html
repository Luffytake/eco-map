<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эко-Профиль</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #1c1c1e);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }

    .card {
      background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .avatar-container {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #2ecc71;
    }

    .badge-icon {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: #2ecc71;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .user-name {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px 0;
    }

    .user-handle {
      font-size: 14px;
      color: #8e8e93;
      margin: 0 0 16px 0;
    }

    .status-tag {
      display: inline-block;
      background-color: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .stat-box {
      background-color: var(--tg-theme-bg-color, #1c1c1e);
      padding: 14px;
      border-radius: 14px;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-lbl {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-container">
      <img id="user-avatar" class="avatar" src="https://ui-avatars.com/api/?name=Eco&background=2ecc71&color=fff" alt="Avatar">
      <div class="badge-icon">🌱</div>
    </div>

    <h2 id="user-name" class="user-name">Загрузка...</h2>
    <p id="user-handle" class="user-handle">@username • ID: 00000</p>

    <div class="status-tag" id="user-rank">Эко-новичок 🌱</div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-val" id="reports-count">0</div>
        <div class="stat-lbl">Отчетов</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="eco-points">0 🏆</div>
        <div class="stat-lbl">Эко-баллы</div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const tg = window.Telegram?.WebApp;

      if (tg) {
        tg.ready();
        tg.expand();

        // Небольшая задержка для гарантированного считывания данных
        setTimeout(() => {
          const user = tg.initDataUnsafe?.user;

          if (user) {
            const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ');
            document.getElementById('user-name').innerText = fullName || "Пользователь";

            const handleText = user.username ? `@${user.username}` : `ID: ${user.id}`;
            document.getElementById('user-handle').innerText = `${handleText} • ID: ${user.id}`;

            if (user.photo_url) {
              document.getElementById('user-avatar').src = user.photo_url;
            } else {
              const nameForAvatar = encodeURIComponent(user.first_name || "User");
              document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${nameForAvatar}&background=2ecc71&color=fff&size=128`;
            }
          } else {
            document.getElementById('user-name').innerText = "Гость";
            document.getElementById('user-handle').innerText = "Данные профиля недоступны";
          }
        }, 100);
      }
    });
  </script>
</body>
</html>
