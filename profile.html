<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эко-Профиль</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 390px;
      position: relative;
    }

    .menu-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
    }

    .menu-btn span {
      width: 24px;
      height: 3px;
      background-color: #ffffff;
      border-radius: 2px;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    /* Контейнер аватарки */
    .avatar-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px dashed #81c784;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2c2c2e; /* Нейтральный темный фон до загрузки */
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Текстовая заглушка, если нет фото */
    .avatar-placeholder {
      font-size: 40px;
      font-weight: bold;
      color: #81c784;
      text-transform: uppercase;
    }

    .username {
      margin-top: 16px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      min-height: 29px; /* Предотвращает дергание верстки */
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="menu-btn" onclick="openSettings()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="profile-header">
      <div class="avatar-wrapper" id="avatar-container">
        <!-- Аватар или первая буква имени подгрузится динамически -->
      </div>
      <div id="username" class="username"></div>
    </div>
  </div>

  <script>
    function initProfile() {
      const tg = window.Telegram?.WebApp;
      
      if (tg) {
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        const usernameEl = document.getElementById('username');
        const avatarContainer = document.getElementById('avatar-container');

        if (user) {
          // 1. Установка никнейма или имени
          let displayName = "";
          if (user.username) {
            displayName = user.username;
          } else if (user.first_name) {
            displayName = user.first_name + (user.last_name ? " " + user.last_name : "");
          } else {
            displayName = "ПОЛЬЗОВАТЕЛЬ";
          }
          usernameEl.innerText = displayName.toUpperCase();

          // 2. Установка аватарки
          if (user.photo_url) {
            avatarContainer.innerHTML = `<img src="${user.photo_url}" alt="Avatar">`;
          } else {
            // Если аватарки в TG нет — ставим первую букву имени на стильном фоне
            const firstLetter = displayName.charAt(0).toUpperCase();
            avatarContainer.innerHTML = `<div class="avatar-placeholder">${firstLetter}</div>`;
          }
        } else {
          // Запасной вариант для тестирования в обычном браузере
          usernameEl.innerText = "ГОСТЬ";
          avatarContainer.innerHTML = `<div class="avatar-placeholder">G</div>`;
        }
      }
    }

    // Запускаем инициализацию сразу после загрузки DOM
    document.addEventListener("DOMContentLoaded", initProfile);

    function openSettings() {
      const tg = window.Telegram?.WebApp;
      if (tg) tg.showAlert("Настройки");
    }
  </script>
</body>
</html>
