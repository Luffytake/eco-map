<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Профиль - Eco Khujand</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-color: #2ecc71;
            --accent-dark: #27ae60;
            --subtext-color: #7f8c8d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            background-color: #e0e0e0;
        }

        .user-name {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px;
        }

        .user-rank {
            display: inline-block;
            background: rgba(46, 204, 113, 0.15);
            color: var(--accent-dark);
            font-weight: 600;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f8faf9;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            border: 1px solid #eef2f0;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent-dark);
        }

        .stat-label {
            font-size: 12px;
            color: var(--subtext-color);
            margin-top: 4px;
        }

        .progress-section {
            text-align: left;
            margin-top: 10px;
        }

        .progress-title {
            font-size: 13px;
            color: var(--subtext-color);
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            background: #e9ecef;
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <img id="user-avatar" class="avatar" src="https://via.placeholder.com/90?text=Eco" alt="Avatar">
        </div>
        <h2 id="user-name" class="user-name">Загрузка...</h2>
        <div id="user-rank" class="user-rank">🌱 Новичок</div>

        <div class="stats-grid">
            <div class="stat-card">
                <div id="user-points" class="stat-value">0</div>
                <div class="stat-label">Всего баллов</div>
            </div>
            <div class="stat-card">
                <div id="user-reports" class="stat-value">0</div>
                <div class="stat-label">Эко-отчётов</div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-title">
                <span>Прогресс ранга</span>
                <span id="progress-text">0 / 100</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Получаем данные пользователя из Telegram WebApp
        const tgUser = tg?.initDataUnsafe?.user;
        const userId = tgUser?.id || 5581941983; // Резервный ID для тестов
        const userName = tgUser ? `${tgUser.first_name || ''} ${tgUser.last_name || ''}`.trim() : 'Эко-Активист';
        const photoUrl = tgUser?.photo_url || 'https://via.placeholder.com/90?text=Eco';

        document.getElementById('user-name').innerText = userName;
        document.getElementById('user-avatar').src = photoUrl;

        async function fetchProfileData() {
            try {
                const response = await fetch(`https://khujand-eco-bot.onrender.com/api/user/${userId}`);
                if (!response.ok) throw new Error('Ошибка сети');
                
                const data = await response.json();

                const points = data.points || 0;
                const reportsCount = data.reports_count || 0;

                document.getElementById('user-points').innerText = points;
                document.getElementById('user-reports').innerText = reportsCount;

                // Расчёт ранга и шкалы прогресса
                let rank = "🌱 Новичок";
                let nextRankPoints = 100;
                let prevRankPoints = 0;

                if (points >= 600) {
                    rank = "👑 Эко-Герой";
                    prevRankPoints = 600;
                    nextRankPoints = 600; // Максимальный ранг
                } else if (points >= 300) {
                    rank = "🌳 Защитник природы";
                    prevRankPoints = 300;
                    nextRankPoints = 600;
                } else if (points >= 100) {
                    rank = "🌿 Активист";
                    prevRankPoints = 100;
                    nextRankPoints = 300;
                }

                document.getElementById('user-rank').innerText = rank;

                // Расчёт процента для Progress Bar
                let percent = 100;
                if (nextRankPoints > prevRankPoints) {
                    percent = Math.min(100, Math.max(0, ((points - prevRankPoints) / (nextRankPoints - prevRankPoints)) * 100));
                    document.getElementById('progress-text').innerText = `${points} / ${nextRankPoints}`;
                } else {
                    document.getElementById('progress-text').innerText = `${points} (Макс.)`;
                }

                document.getElementById('progress-fill').style.width = `${percent}%`;

            } catch (err) {
                console.error("Ошибка при загрузке профиля:", err);
            }
        }

        fetchProfileData();
    </script>
</body>
</html>
