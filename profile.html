<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эко-Профиль</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 390px;
      position: relative;
    }

    /* Пункт управления (три тире) */
    .menu-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
    }

    .menu-btn span {
      width: 24px;
      height: 3px;
      background-color: #ffffff;
      border-radius: 2px;
    }

    /* Блок аватарки и имени */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    .avatar-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px dashed #81c784; /* Пунктирный контур как на макете */
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #a8e063, #56ab2f);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .username {
      margin-top: 16px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Пункт управления -->
    <div class="menu-btn" onclick="openSettings()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Аватар и Имя -->
    <div class="profile-header">
      <div class="avatar-wrapper">
        <img id="user-avatar" src="" alt="Avatar" style="display: none;">
      </div>
      <div id="username" class="username">MANU</div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        
        // Автоматически подтягиваем аватарку и имя из Telegram
        const user = tg.initDataUnsafe?.user;
        if (user) {
          if (user.username) {
            document.getElementById('username').innerText = user.username.toUpperCase();
          } else if (user.first_name) {
            document.getElementById('username').innerText = user.first_name.toUpperCase();
          }

          if (user.photo_url) {
            const avatarImg = document.getElementById('user-avatar');
            avatarImg.src = user.photo_url;
            avatarImg.style.display = 'block';
          }
        }
      }
    });

    function openSettings() {
      // Клик по трем полоскам
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.showAlert("Раздел настроек открыт");
      }
    }
  </script>
</body>
</html>
