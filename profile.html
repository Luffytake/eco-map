<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эко-Профиль</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 390px;
      position: relative;
    }

    /* Кнопка Меню (Три тире) */
    .menu-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
      z-index: 10;
    }

    .menu-btn span {
      width: 24px;
      height: 3px;
      background-color: #ffffff;
      border-radius: 2px;
    }

    /* Шапка профиля */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px dashed #81c784;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2c2c2e;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-placeholder {
      font-size: 40px;
      font-weight: bold;
      color: #81c784;
      text-transform: uppercase;
    }

    #file-input {
      display: none;
    }

    .username {
      margin-top: 16px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Выпадающее окно Настроек (Modal) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      width: 85%;
      max-width: 320px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      color: #8e8e93;
      font-size: 20px;
      cursor: pointer;
    }

    /* Кнопки управления в настройках */
    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .setting-btn {
      width: 100%;
      background: #2c2c2e;
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s;
    }

    .setting-btn:active {
      background: #3a3a3c;
    }

    .setting-btn.danger {
      color: #ff453a;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Кнопка Три полоски -->
    <div class="menu-btn" onclick="toggleSettings(true)">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Блок Аватарки и Имени -->
    <div class="profile-header">
      <div class="avatar-wrapper">
        <div id="avatar-container"></div>
      </div>
      <div id="username" class="username">Гость</div>
    </div>
  </div>

  <!-- Скрытый инпут файла -->
  <input type="file" id="file-input" accept="image/*" onchange="uploadAvatar(event)">

  <!-- Модальное окно Настроек -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Настройки ⚙️</div>
        <button class="close-btn" onclick="toggleSettings(false)">✕</button>
      </div>

      <div class="settings-list">
        <button class="setting-btn" onclick="triggerFileInput()">
          <span>Сменить аватарку</span>
          <span>📸</span>
        </button>

        <button class="setting-btn" onclick="editUsername()">
          <span>Изменить никнейм</span>
          <span>✏️</span>
        </button>

        <button class="setting-btn danger" onclick="resetProfile()">
          <span>Сбросить данные</span>
          <span>🔄</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }
      loadProfileData();
    });

    // Показать / Скрыть настройки
    function toggleSettings(show) {
      document.getElementById("settings-modal").style.display = show ? "flex" : "none";
    }

    // Загрузка сохраненных данных
    function loadProfileData() {
      const savedName = localStorage.getItem("custom_username");
      const savedAvatar = localStorage.getItem("custom_avatar");

      const usernameEl = document.getElementById("username");
      const avatarContainer = document.getElementById("avatar-container");

      usernameEl.innerText = savedName ? savedName.toUpperCase() : "MANU";

      if (savedAvatar) {
        avatarContainer.innerHTML = `<img src="${savedAvatar}" alt="Avatar">`;
      } else {
        const firstLetter = usernameEl.innerText.charAt(0);
        avatarContainer.innerHTML = `<div class="avatar-placeholder">${firstLetter}</div>`;
      }
    }

    // Изменение никнейма
    function editUsername() {
      const currentName = document.getElementById("username").innerText;
      const newName = prompt("Введи новый никнейм:", currentName);

      if (newName && newName.trim() !== "") {
        const formattedName = newName.trim().toUpperCase();
        document.getElementById("username").innerText = formattedName;
        localStorage.setItem("custom_username", formattedName);
        
        // Если аватарки-картинки нет, обновляем букву
        if (!localStorage.getItem("custom_avatar")) {
          document.getElementById("avatar-container").innerHTML = 
            `<div class="avatar-placeholder">${formattedName.charAt(0)}</div>`;
        }
      }
    }

    // Загрузка аватарки
    function triggerFileInput() {
      document.getElementById("file-input").click();
    }

    function uploadAvatar(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const base64Image = e.target.result;
        document.getElementById("avatar-container").innerHTML = `<img src="${base64Image}" alt="Avatar">`;
        try {
          localStorage.setItem("custom_avatar", base64Image);
        } catch (err) {
          alert("Файл слишком большой. Выбери другое фото.");
        }
      };
      reader.readAsDataURL(file);
    }

    // Сброс настроек
    function resetProfile() {
      if (confirm("Сбросить ник и аватарку?")) {
        localStorage.removeItem("custom_username");
        localStorage.removeItem("custom_avatar");
        loadProfileData();
        toggleSettings(false);
      }
    }
  </script>
</body>
</html>
