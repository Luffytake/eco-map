<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Khujand App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Routing Machine CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Вкладки */
        .tab-content {
            display: none;
            flex: 1;
            position: relative;
            overflow-y: auto;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Карта */
        #map {
            width: 100%;
            height: 100%;
            flex: 1;
        }
        .leaflet-routing-container {
            background-color: rgba(30, 30, 30, 0.95) !important;
            color: #fff !important;
            border-radius: 8px;
            font-size: 12px;
            max-width: 250px;
        }
        .route-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
            font-weight: bold;
            width: 100%;
        }

        /* Кнопка ручного обновления геолокации поверх карты */
        .locate-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .locate-btn:active {
            opacity: 0.8;
        }

        /* Формы и элементы интерфейса */
        .container {
            padding: 16px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #2a2a2a;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #4CAF50;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #aaa;
        }
        select, input, button.action-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #252525;
            color: #fff;
            font-size: 14px;
        }
        button.action-btn {
            background-color: #4CAF50;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button.action-btn:active {
            opacity: 0.8;
        }
        button.action-btn:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }

        /* Нижняя навигация */
        .nav-bar {
            display: flex;
            background-color: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            height: 60px;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            background: none;
            border: none;
        }
        .nav-item.active {
            color: #4CAF50;
            font-weight: bold;
        }
        .nav-item span {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- Вкладка 1: Карта -->
    <div id="tab-map" class="tab-content active">
        <button class="locate-btn" onclick="requestLocation()">📍 Где я?</button>
        <div id="map"></div>
    </div>

    <!-- Вкладка 2: Отправить отчёт -->
    <div id="tab-report" class="tab-content">
        <div class="container">
            <div class="card">
                <h2>🌱 Отправить эко-отчёт</h2>
                
                <label for="action-type">Выберите действие:</label>
                <select id="action-type">
                    <option value="Уборка территории" data-points="30">🧹 Уборка территории (+30 баллов)</option>
                    <option value="Сдача пластика / стекла" data-points="20">🍾 Сдача пластика / стекла (+20 баллов)</option>
                    <option value="Сдача макулатуры" data-points="15">📦 Сдача макулатуры (+15 баллов)</option>
                    <option value="Сигнал о переполнении" data-points="10">⚠️ Сигнал о переполненном баке (+10 баллов)</option>
                </select>

                <label for="photo-file">Фотография работы (обязательно):</label>
                <input type="file" id="photo-file" accept="image/*">

                <label for="report-comment">Комментарий (необязательно):</label>
                <input type="text" id="report-comment" placeholder="Например: Собрал 2 пакета пластика...">

                <button class="action-btn" id="submit-btn" onclick="sendReport()">Отправить на проверку</button>
            </div>
        </div>
    </div>

    <!-- Вкладка 3: Профиль -->
    <div id="tab-profile" class="tab-content">
        <div class="container">
            <div class="card" style="text-align: center;">
                <h2 id="user-name">Загрузка...</h2>
                <p style="color: #aaa; margin-bottom: 12px;">Ваш баланс:</p>
                <div style="font-size: 32px; font-weight: bold; color: #4CAF50;" id="user-points">0</div>
                <p style="color: #888; font-size: 13px; margin-top: 4px;">эко-баллов</p>
            </div>
        </div>
    </div>

    <!-- Навигационная панель -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('map')">
            <span>🗺️</span> Карта
        </button>
        <button class="nav-item" onclick="switchTab('report')">
            <span>➕</span> Отчёт
        </button>
        <button class="nav-item" onclick="switchTab('profile')">
            <span>👤</span> Профиль
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // --- Переключение вкладок ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            const targetBtn = Array.from(document.querySelectorAll('.nav-item')).find(btn => 
                btn.getAttribute('onclick')?.includes(tabName)
            );
            if (targetBtn) {
                targetBtn.classList.add('active');
            }

            if (tabName === 'map') {
                setTimeout(() => map.invalidateSize(), 100);
            }
            if (tabName === 'profile') {
                loadProfile();
            }
        }

        // --- Инициализация карты ---
        const map = L.map('map').setView([40.2950, 69.6100], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const containerStyle = {
            radius: 8,
            fillColor: "#4CAF50",
            color: "#ffffff",
            weight: 1.5,
            opacity: 1,
            fillOpacity: 0.8
        };

        const urnStyle = {
            radius: 6,
            fillColor: "#2196F3",
            color: "#ffffff",
            weight: 1.5,
            opacity: 1,
            fillOpacity: 0.8
        };

        let userLocation = null;
        let routingControl = null;

        // --- Определение геолокации ---
        function requestLocation() {
            if (!navigator.geolocation) {
                alert("Геолокация не поддерживается вашим устройством/браузером.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLocation = [position.coords.latitude, position.coords.longitude];
                    
                    map.setView(userLocation, 16);

                    if (window.userMarker) {
                        window.userMarker.setLatLng(userLocation);
                    } else {
                        window.userMarker = L.circleMarker(userLocation, {
                            radius: 8,
                            fillColor: "#E91E63",
                            color: "#ffffff",
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.9
                        }).addTo(map).bindPopup("<b>Вы здесь</b>").openPopup();
                    }
                },
                (error) => {
                    let errorMsg = "Не удалось определить местоположение.";
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = "Доступ к геолокации запрещен. Включите доступ к геоданным в Telegram/браузере.";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = "Сигнал GPS недоступен.";
                            break;
                        case error.TIMEOUT:
                            errorMsg = "Превышено время ожидания сигнала GPS.";
                            break;
                    }
                    alert(errorMsg);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // --- Построение маршрута ---
        function buildRoute(destLat, destLng) {
            if (!userLocation) {
                alert("Сначала укажите или обновите ваше местоположение (кнопка 📍 Где я?)");
                requestLocation();
                return;
            }

            if (routingControl) {
                map.removeControl(routingControl);
            }

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(userLocation[0], userLocation[1]),
                    L.latLng(destLat, destLng)
                ],
                router: L.Routing.osrmv1({
                    profile: 'foot'
                }),
                lineOptions: {
                    styles: [{ color: '#4CAF50', opacity: 0.8, weight: 6 }]
                },
                addWaypoints: false,
                draggableWaypoints: false,
                fitSelectedRoutes: true,
                showAlternatives: false
            }).addTo(map);
        }

        // --- Взаимодействие с API ---
        const SERVER_URL = "https://eco-khujand-bot.onrender.com";

        async function loadProfile() {
            const userId = tg?.initDataUnsafe?.user?.id || 123456;
            const userName = tg?.initDataUnsafe?.user?.first_name || "Эко Пользователь";
            
            document.getElementById('user-name').innerText = userName;

            try {
                const res = await fetch(`${SERVER_URL}/api/user/${userId}`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('user-points').innerText = data.points;
                }
            } catch (e) {
                console.error("Ошибка при получении профиля:", e);
            }
        }

        async function sendReport() {
            const fileInput = document.getElementById('photo-file');
            const actionSelect = document.getElementById('action-type');
            const commentInput = document.getElementById('report-comment');
            const submitBtn = document.getElementById('submit-btn');

            if (!fileInput.files[0]) {
                alert("Пожалуйста, прикрепите фотографию!");
                return;
            }

            const selectedOption = actionSelect.options[actionSelect.selectedIndex];
            const actionType = selectedOption.value;
            const points = selectedOption.getAttribute('data-points');
            const comment = commentInput.value.trim();
            const userId = tg?.initDataUnsafe?.user?.id || 123456;

            const formData = new FormData();
            formData.append('user_id', userId);
            formData.append('action_type', actionType);
            formData.append('points', points);
            formData.append('comment', comment);
            formData.append('photo', fileInput.files[0]);

            if (userLocation) {
                formData.append('latitude', userLocation[0]);
                formData.append('longitude', userLocation[1]);
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Отправка...";

            try {
                const res = await fetch(`${SERVER_URL}/api/report`, {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    alert("Отчёт успешно отправлен! Модератор проверит его в ближайшее время.");
                    fileInput.value = "";
                    commentInput.value = "";
                    switchTab('profile');
                } else {
                    alert("Ошибка при отправке отчёта. Попробуйте ещё раз.");
                }
            } catch (e) {
                alert("Не удалось связаться с сервером.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Отправить на проверку";
            }
        }

        // Запуск определения местоположения и загрузка данных профиля
        requestLocation();
        loadProfile();
    </script>
