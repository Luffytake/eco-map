<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khujand Eco Bot</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            color: #ffffff;
        }

        /* Контейнеры страниц */
        .tab-content {
            display: none;
            width: 100%;
            height: calc(100% - 65px);
            position: absolute;
            top: 0;
            left: 0;
            overflow-y: auto;
        }

        .tab-content.active {
            display: block;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Форма Отчёта (Тёмный стиль с фото) */
        .container {
            padding: 20px;
        }

        .title {
            color: #4cd964;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .file-input-wrapper {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-btn {
            background: #2c2c2e;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            border: none;
        }

        .submit-btn {
            width: 100%;
            background: #2e7d32;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* Профиль */
        .profile-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .stat-box {
            background: #252525;
            padding: 14px;
            border-radius: 12px;
        }

        /* Нижняя навигация (как на скриншоте) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #121212;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
            z-index: 1000;
        }

        .nav-btn {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666666;
            font-size: 11px;
            cursor: pointer;
            flex: 1;
            height: 100%;
        }

        .nav-btn .icon {
            font-size: 22px;
            margin-bottom: 3px;
        }

        .nav-btn.active {
            color: #4cd964;
        }
    </style>
</head>
<body>

    <!-- Вкладка Карта -->
    <div id="map-tab" class="tab-content active">
        <div id="map"></div>
    </div>

    <!-- Вкладка Отчёт -->
    <div id="report-tab" class="tab-content">
        <div class="container">
            <div class="title">🌱 Отправить эко-отчёт</div>
            <form id="reportForm" onsubmit="sendReport(event)">
                <div class="form-group">
                    <label>Выберите действие:</label>
                    <select id="action_type" class="form-control" required>
                        <option value="Сдача пластика / стекла (+20 баллов)">🍾 Сдача пластика / стекла (+20 баллов)</option>
                        <option value="Переполненный бак (+20 баллов)">🗑 Переполненный бак (+20 баллов)</option>
                        <option value="Уборка территории (+50 баллов)">🧹 Уборка территории (+50 баллов)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Фотография работы (обязательно):</label>
                    <div class="file-input-wrapper">
                        <label for="photo" class="file-btn">Выбрать файл</label>
                        <span id="file-name" style="font-size: 13px; color: #888;">Файл не выбран</span>
                        <input type="file" id="photo" accept="image/*" style="display: none;" onchange="updateFileName(this)" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Комментарий:</label>
                    <textarea id="comment" class="form-control" rows="3" placeholder="Опишите детали..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Отправить</button>
            </form>
        </div>
    </div>

    <!-- Вкладка Профиль -->
    <div id="profile-tab" class="tab-content">
        <div class="container">
            <div class="profile-card">
                <h2 id="user-name">Пользователь</h2>
                <p id="user-id" style="color: #666; font-size: 13px; margin-top: 4px;">ID: -</p>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div id="user-points" style="font-size: 22px; font-weight: bold; color: #4cd964;">0</div>
                        <div style="font-size: 12px; color: #888;">Баллы</div>
                    </div>
                    <div class="stat-box">
                        <div id="user-reports" style="font-size: 22px; font-weight: bold; color: #4cd964;">0</div>
                        <div style="font-size: 12px; color: #888;">Отчёты</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Навигация (Нижняя панель с фото) -->
    <nav class="bottom-nav">
        <button class="nav-btn active" id="btn-map" onclick="switchTab('map')">
            <span class="icon">🗺</span>
            <span>Карта</span>
        </button>
        <button class="nav-btn" id="btn-report" onclick="switchTab('report')">
            <span class="icon">➕</span>
            <span>Отчёт</span>
        </button>
        <button class="nav-btn" id="btn-profile" onclick="switchTab('profile')">
            <span class="icon">👤</span>
            <span>Профиль</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const currentUserId = tg?.initDataUnsafe?.user?.id || 5581941983;

        function updateFileName(input) {
            const fileName = input.files[0] ? input.files[0].name : "Файл не выбран";
            document.getElementById('file-name').innerText = fileName;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`${tabName}-tab`).classList.add('active');
            document.getElementById(`btn-${tabName}`).classList.add('active');

            if (tabName === 'map') {
                setTimeout(() => map.invalidateSize(), 200);
            } else if (tabName === 'profile') {
                loadProfile();
            }
        }

        async function loadProfile() {
            try {
                const res = await fetch(`https://khujand-eco-bot.onrender.com/api/user/${currentUserId}`);
                const data = await res.json();
                document.getElementById('user-name').innerText = tg?.initDataUnsafe?.user?.first_name || data.username || 'Пользователь';
                document.getElementById('user-id').innerText = `ID: ${currentUserId}`;
                document.getElementById('user-points').innerText = data.points || 0;
                document.getElementById('user-reports').innerText = data.reports_count || 0;
            } catch (e) {
                console.error(e);
            }
        }

        // Карта
        const map = L.map('map').setView([40.292341, 69.592556], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // Метки
        const points = [
            [40.299929, 69.620699], [40.299659, 69.620296], [40.295390, 69.619887], 
            [40.299663, 69.617160], [40.297905, 69.615246], [40.290171, 69.591860],
            [40.294807, 69.594147], [40.295446, 69.590084], [40.292341, 69.592556]
        ];

        points.forEach(pt => {
            L.circleMarker(pt, { radius: 7, fillColor: "#2ecc71", color: "#fff", weight: 2, fillOpacity: 0.9 }).addTo(map);
        });

        async function sendReport(event) {
            event.preventDefault();
            const actionType = document.getElementById('action_type').value;
            const comment = document.getElementById('comment').value;
            const photoInput = document.getElementById('photo');

            if (!photoInput.files[0]) {
                alert('Выберите фото!');
                return;
            }

            const formData = new FormData();
            formData.append('user_id', currentUserId);
            formData.append('action_type', actionType);
            formData.append('comment', comment);
            formData.append('points', actionType.includes("Уборка") ? 50 : 20);
            formData.append('photo', photoInput.files[0]);

            try {
                const response = await fetch('https://khujand-eco-bot.onrender.com/api/report', {
                    method: 'POST',
                    body: formData
                });
                if (response.ok) {
                    alert('✅ Отчёт отправлен!');
                    document.getElementById('reportForm').reset();
                    document.getElementById('file-name').innerText = "Файл не выбран";
                    switchTab('map');
                } else {
                    const err = await response.json();
                    alert('Ошибка: ' + (err.detail || 'Не удалось отправить'));
                }
            } catch (e) {
                alert('Ошибка подключения к серверу');
            }
        }
    </script>
</body>
</html>
