<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco Khujand App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Routing Machine CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      background-color: var(--tg-theme-bg-color, #f4f4f9);
      color: var(--tg-theme-text-color, #333);
    }
    .page { display: none; padding: 20px; padding-bottom: 90px; }
    .active-page { display: block; }
    
    #page-map { padding: 0; padding-bottom: 60px; }
    #map { width: 100%; height: calc(100vh - 60px); }

    .card {
      background: var(--tg-theme-secondary-bg-color, #fff);
      padding: 16px; border-radius: 14px; margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    
    .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
    .avatar {
      width: 55px; height: 55px; border-radius: 50%;
      background: #2ea6ff; color: #fff; display: flex;
      align-items: center; justify-content: center;
      font-size: 24px; font-weight: bold;
    }
    .user-info h3 { margin: 0; font-size: 18px; }
    .user-info p { margin: 3px 0 0 0; color: #777; font-size: 13px; }

    .balance-box {
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: #fff; padding: 18px; border-radius: 12px; text-align: center;
    }
    .balance-val { font-size: 32px; font-weight: bold; margin: 5px 0; }

    .progress-container { margin-top: 15px; }
    .progress-bar { height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; }
    .progress-fill { height: 100%; background: #4CAF50; width: 0%; transition: width 0.3s; }

    .rule-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #eee;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--tg-theme-secondary-bg-color, #fff);
      display: flex; justify-content: space-around;
      padding: 12px 0; border-top: 1px solid #ddd; z-index: 1000;
    }
    .nav-btn { border: none; background: none; color: #888; font-weight: bold; font-size: 13px; cursor: pointer; }
    .nav-btn.active { color: #2ea6ff; }
    
    button.action-btn {
      width: 100%; padding: 12px;
      background: #2ea6ff; color: #fff; border: none;
      border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Вкладка 1: Карта -->
  <div id="page-map" class="page active-page">
    <div id="map"></div>
  </div>

  <!-- Вкладка 2: Отчёт -->
  <div id="page-report" class="page">
    <h2>🌱 Сообщить об активности</h2>
    <div class="card">
      <p>Выберите действие:</p>
      <button class="action-btn" onclick="submitReport('Плоггинг', 50)">🧹 Уборка / Плоггинг (+50 баллов)</button>
      <br><br>
      <button class="action-btn" style="background:#4CAF50;" onclick="submitReport('Сдача пластика', 30)">♻️ Сдача пластика (+30 баллов)</button>
    </div>
  </div>

  <!-- Вкладка 3: Профиль -->
  <div id="page-profile" class="page">
    <div class="card">
      <div class="profile-header">
        <div class="avatar" id="avatar-char">U</div>
        <div class="user-info">
          <h3 id="user-name">Загрузка...</h3>
          <p id="user-id-text">ID: --</p>
        </div>
      </div>

      <div class="balance-box">
        <div>Ваш эко-баланс</div>
        <div class="balance-val" id="user-points">0</div>
        <div id="user-status">Статус: Новичок 🌿</div>
      </div>

      <div class="progress-container">
        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
          <span>Прогресс уровня</span>
          <span id="progress-text">0 / 100</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </div>

    <h3>ℹ️ Как работает система?</h3>
    <div class="card">
      <div class="rule-item"><span>🧹 Уборка / Плоггинг</span><b>+50 баллов</b></div>
      <div class="rule-item"><span>♻️ Сдача пластика</span><b>+30 баллов</b></div>
      <div class="rule-item"><span>📍 Отметка эко-проблемы</span><b>+20 баллов</b></div>
    </div>
  </div>

  <!-- Навигация -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchPage('map', this)">🗺️ Карта</button>
    <button class="nav-btn" onclick="switchPage('report', this)">➕ Отчёт</button>
    <button class="nav-btn" onclick="switchPage('profile', this)">👤 Профиль</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const userId = tg.initDataUnsafe?.user?.id || 12345678;
    const userName = tg.initDataUnsafe?.user?.first_name || "Эко-пользователь";

    document.getElementById("user-name").innerText = userName;
    document.getElementById("user-id-text").innerText = `ID: ${userId}`;
    document.getElementById("avatar-char").innerText = userName.charAt(0).toUpperCase();

    // --- ИНИЦИАЛИЗА КАРТЫ (Худжанд) ---
    const khujandCoords = [40.2826, 69.6222];
    const map = L.map('map').setView(khujandCoords, 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let routingControl = null;
    let userMarker = null;

    // Список баков и эко-точек Худжанда (микрорайоны)
    const ecoSpots = [
      { name: "Контейнеры (12 мкр)", lat: 40.2750, lng: 69.6350, type: "Раздельный сбор" },
      { name: "Эко-точка (13 мкр)", lat: 40.2790, lng: 69.6380, type: "Пластик / Стекло" },
      { name: "Баки (18 мкр)", lat: 40.2860, lng: 69.6150, type: "Общий сбор" },
      { name: "Контейнеры (19 мкр)", lat: 40.2890, lng: 69.6180, type: "Раздельный сбор" },
      { name: "Эко-точка (Универмаг)", lat: 40.2810, lng: 69.6230, type: "Пластик" },
      { name: "Баки (Улица Мира)", lat: 40.2840, lng: 69.6270, type: "Общий сбор" }
    ];

    // Добавление меток баков
    ecoSpots.forEach(spot => {
      const marker = L.marker([spot.lat, spot.lng]).addTo(map);
      marker.bindPopup(`
        <b>${spot.name}</b><br>
        Тип: ${spot.type}<br><br>
        <button onclick="buildRoute(${spot.lat}, ${spot.lng})" style="background:#2ea6ff;color:#fff;border:none;padding:6px 12px;border-radius:5px;cursor:pointer;">
          🚶 Построить маршрут
        </button>
      `);
    });

    // Определение геолокации пользователя
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(position => {
        const uLat = position.coords.latitude;
        const uLng = position.coords.longitude;
        userMarker = L.marker([uLat, uLng]).addTo(map).bindPopup("<b>Вы здесь</b>").openPopup();
      });
    }

    // Функция построения маршрута
    function buildRoute(destLat, destLng) {
      if (!navigator.geolocation) {
        alert("Геолокация не поддерживается вашим устройством");
        return;
      }

      navigator.geolocation.getCurrentPosition(position => {
        const startLat = position.coords.latitude;
        const startLng = position.coords.longitude;

        if (routingControl) {
          map.removeControl(routingControl);
        }

        routingControl = L.Routing.control({
          waypoints: [
            L.latLng(startLat, startLng),
            L.latLng(destLat, destLng)
          ],
          routeWhileDragging: true,
          language: 'ru'
        }).addTo(map);

        map.closePopup();
      }, () => {
        alert("Не удалось определить вашу геолокацию для построения маршрута.");
      });
    }

    function switchPage(pageId, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + pageId).classList.add('active-page');
      btn.classList.add('active');

      if (pageId === 'map') {
        setTimeout(() => map.invalidateSize(), 100);
      }
      if (pageId === 'profile') loadProfile();
    }

    async function loadProfile() {
      try {
        const res = await fetch(`/api/user/${userId}`);
        if (res.ok) {
          const data = await res.json();
          const pts = data.points || 0;
          document.getElementById("user-points").innerText = pts;

          let status = "Новичок 🌿";
          let maxPts = 100;
          if (pts >= 100 && pts < 300) { status = "Эко-Активист 🌱"; maxPts = 300; }
          else if (pts >= 300) { status = "Эко-Герой 🌳"; maxPts = 1000; }

          document.getElementById("user-status").innerText = `Статус: ${status}`;
          const fillPercent = Math.min(100, Math.round((pts / maxPts) * 100));
          document.getElementById("progress-fill").style.width = fillPercent + "%";
          document.getElementById("progress-text").innerText = `${pts} / ${maxPts}`;
        }
      } catch (e) { console.error("Ошибка профиля", e); }
    }

    async function submitReport(actionType, points) {
      try {
        const res = await fetch('/api/report', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ user_id: userId, action_type: actionType, points: points })
        });
        if (res.ok) {
          tg.showAlert(`Отчёт отправлен! Начислено +${points} баллов.`);
        }
      } catch (e) { tg.showAlert("Ошибка соединения"); }
    }

    loadProfile();
  </script>
</body>
</html>
