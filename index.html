        #map {

            height: 100%;

        }
        .report-btn {
            position: absolute;

            right: 16px;

            color: white;
            border: none;
            padding: 14px 20px;

        }
        .route-btn {
            background: #3498db;

            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
        }
        /* Modal Style */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: flex-end;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal h3 {
            margin-bottom: 12px;
            color: #2c3e50;
        }
        .form-group {

        }
        .form-group label {

            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 4px;
        }

        function openReportModal() {
            document.getElementById('reportModal').style.display = 'flex';
        }

        function closeReportModal() {
            document.getElementById('reportModal').style.display = 'none';
        }

        async function sendReport(event) {
            event.preventDefault();

            const actionType = document.getElementById('action_type').value;
            const comment = document.getElementById('comment').value;
            const photoInput = document.getElementById('photo');

            if (!photoInput.files[0]) {
                alert('Пожалуйста, прикрепите фото!');
                return;
            }

            // Баллы за действия
            let points = 20;
            if (actionType.includes("Уборка")) points = 50;
            if (actionType.includes("пластика")) points = 30;

            const formData = new FormData();
            formData.append('user_id', currentUserId);
            formData.append('action_type', actionType);
            formData.append('comment', comment);
            formData.append('points', points);
            formData.append('photo', photoInput.files[0]);

            try {
                const response = await fetch('https://khujand-eco-bot.onrender.com/api/report', {
                    method: 'POST',
                    body: formData
                });

                const resData = await response.json();
                if (response.ok) {
                    alert('✅ Отчёт успешно отправлен на модерацию!');
                    closeReportModal();
                    document.getElementById('reportForm').reset();
                } else {
                    alert('Ошибка отправки: ' + (resData.detail || 'Попробуйте позже'));
                }
            } catch (err) {
                console.error(err);
                alert('Ошибка соединения с сервером');
            }
        }
