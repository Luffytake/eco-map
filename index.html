<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eco Khujand App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Routing Machine CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        
        .content-area {
            flex: 1;
            position: relative;
            overflow-y: auto;
        }
        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        #map {
            width: 100%;
            height: 100%;
            flex: 1;
        }
        .leaflet-routing-container {
            background-color: rgba(30, 30, 30, 0.95) !important;
            color: #fff !important;
            border-radius: 8px;
            font-size: 12px;
            max-width: 250px;
        }
        .route-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
            font-weight: bold;
            width: 100%;
        }
        .locate-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .map-legend {
            position: absolute;
            top: 10px;
            right: 105px;
            z-index: 1000;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            line-height: 1.4;
        }

        .container {
            padding: 16px;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #2a2a2a;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #4CAF50;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #aaa;
        }
        select, input, button.action-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #252525;
            color: #fff;
            font-size: 14px;
        }
        button.action-btn {
            background-color: #4CAF50;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button.action-btn:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }

        .profile-wrapper {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }
        .avatar-container {
            margin-top: 10px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #4CAF50;
            border: 3px solid #4CAF50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #121212;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .username {
            margin-top: 10px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }
        .stat-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            border: 1px solid #2a2a2a;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #4CAF50;
        }
        .stat-label {
            font-size: 12px;
            color: #aaaaaa;
            margin-top: 4px;
        }
        .rank-card {
            background-color: #1e1e1e;
            border-radius: 16px;
            width: 100%;
            margin-top: 16px;
            padding: 16px;
            border: 1px solid #2a2a2a;
        }
        .rank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .rank-title {
            color: #4CAF50;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .progress-bar-bg {
            background-color: #333333;
            height: 14px;
            border-radius: 7px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            background-color: #4CAF50;
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .nav-bar {
            display: flex;
            background-color: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            height: 60px;
            z-index: 100;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            background: none;
            border: none;
        }
        .nav-item.active {
            color: #4CAF50;
            font-weight: bold;
        }
        .nav-item span {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="content-area">
        <!-- Вкладка 1: Карта -->
        <div id="tab-map" class="tab-content active">
            <div class="map-legend">🔵 — Урна<br>🟢 — Мусорные баки</div>
            <button class="locate-btn" onclick="requestLocation()">📍 Где я?</button>
            <div id="map"></div>
        </div>

        <!-- Вкладка 2: Отправить отчёт -->
        <div id="tab-report" class="tab-content">
            <div class="container">
                <div class="card">
                    <h2>🌱 Отправить эко-отчёт</h2>
                    
                    <label for="action-type">Выберите действие:</label>
                    <select id="action-type">
                        <option value="Уборка территории" data-points="30">🧹 Уборка территории (+30 баллов)</option>
                        <option value="Сдача пластика / стекла" data-points="20">🍾 Сдача пластика / стекла (+20 баллов)</option>
                        <option value="Новое урна" data-points="15">🚮 Новое урна (+15 баллов)</option>
                        <option value="Сигнал о переполнении" data-points="10">⚠️ Сигнал о переполненном баке (+10 баллов)</option>
                    </select>

                    <label for="photo-file">Фотография работы (обязательно):</label>
                    <input type="file" id="photo-file" accept="image/*">

                    <label for="report-comment">Комментарий (необязательно):</label>
                    <input type="text" id="report-comment" placeholder="Например: Собрал 2 пакета пластика...">

                    <button class="action-btn" id="submit-btn" onclick="sendReport()">Отправить на проверку</button>
                </div>
            </div>
        </div>

        <!-- Вкладка 3: Профиль -->
        <div id="tab-profile" class="tab-content">
            <div class="profile-wrapper">
                <div class="avatar-container" id="avatarBox">
                    👤
                </div>
                <div class="username" id="user-name">Загрузка...</div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="user-points">0</div>
                        <div class="stat-label">Эко-баллы 🏆</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="reports-count">0</div>
                        <div class="stat-label">Отчётов 📋</div>
                    </div>
                </div>

                <div class="rank-card">
                    <div class="rank-header">
                        <div class="rank-title" id="rank-title">Эко-Новичок</div>
                        <div style="font-size: 12px; color: #aaa;" id="rank-progress-text">0 / 100 XP</div>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="rank-bar" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Вкладка 4: Доска почёта (Лидерборд) -->
        <div id="tab-leaderboard" class="tab-content">
            <div class="container">
                <div class="card">
                    <h2>🏆 Топ эко-активистов</h2>
                    <div id="leaderboard-list">
                        <p style="color: #aaa; text-align: center;">Загрузка рейтинга...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Нижняя панель навигации -->
    <div class="nav-bar">
        <button class="nav-item active" data-tab="map" onclick="switchTab('map')">
            <span>🗺️</span> Карта
        </button>
        <button class="nav-item" data-tab="report" onclick="switchTab('report')">
            <span>➕</span> Отчёт
        </button>
        <button class="nav-item" data-tab="profile" onclick="switchTab('profile')">
            <span>👤</span> Профиль
        </button>
        <button class="nav-item" data-tab="leaderboard" onclick="switchTab('leaderboard')">
            <span>🏆</span> Топ
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const SERVER_URL = "https://eco-map-production-fe83.up.railway.app";

        const tgUser = tg?.initDataUnsafe?.user || null;
        const initData = tg?.initData || "";
        const userName = tgUser?.username ? `@${tgUser.username}` : (tgUser?.first_name || "Эко Активист");

        const RANKS = [
            { name: "Эко-Новичок", max: 100 },
            { name: "Эко-Защитник", max: 300 },
            { name: "Эко-Герой", max: 500 }
        ];

        // ---------- утилиты
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function notify(msg) {
            if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) tg.showAlert(msg);
            else alert(msg);
        }

        // ---------- вкладки
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.querySelector(`.nav-item[data-tab="${tabName}"]`)?.classList.add('active');

            if (tabName === 'map') setTimeout(() => map.invalidateSize(), 100);
            if (tabName === 'profile') loadProfile();
            if (tabName === 'leaderboard') loadLeaderboard();
        }

        // ---------- рейтинг
        async function loadLeaderboard() {
            const container = document.getElementById('leaderboard-list');
            try {
                const res = await fetch(`${SERVER_URL}/api/leaderboard`);
                if (!res.ok) throw new Error(res.status);
                const data = await res.json();
                if (data.length === 0) {
                    container.innerHTML = '<p style="color: #aaa; text-align: center;">Пока нет участников</p>';
                    return;
                }
                const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
                container.innerHTML = '<ul style="list-style: none; padding: 0;">' + data.map(item => `
                    <li style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2a2a2a; align-items: center;">
                        <span style="font-size: 15px;">${medals[item.rank] || item.rank + '.'} ${esc(item.username)}</span>
                        <span style="color: #4CAF50; font-weight: bold; font-size: 15px;">${Number(item.points)} XP</span>
                    </li>`).join('') + '</ul>';
            } catch (e) {
                container.innerHTML = '<p style="color: #ff5252; text-align: center;">Не удалось загрузить топ</p>';
            }
        }

        // ---------- карта
        const map = L.map('map').setView([40.2950, 69.6100], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const baseStyle = { color: "#ffffff", weight: 1.5, opacity: 1, fillOpacity: 0.8 };
        const TYPES = {
            c: { title: 'Мусорные баки', style: { ...baseStyle, radius: 8, fillColor: "#4CAF50" } },
            u: { title: 'Уличная урна', style: { ...baseStyle, radius: 6, fillColor: "#2196F3" } }
        };

        // [широта, долгота, тип (c — баки, u — урна), примечание]
        const POINTS = [
            [40.299929, 69.620699, 'c', 'Статус: Чисто'],
            [40.299659, 69.620296, 'u', 'Рядом со скамейкой'],
            [40.295390, 69.619887, 'c', 'Статус: Чисто'],
            [40.299663, 69.617160, 'c', 'Статус: Чисто'],
            [40.297905, 69.615246, 'u', 'Рядом со светофором'],
            [40.290171, 69.591860, 'c', 'Статус: Чисто'],
            [40.294807, 69.594147, 'c', 'Статус: Чисто'],
            [40.295446, 69.590084, 'c', 'Статус: Чисто'],
            [40.292341, 69.592556, 'c', 'Статус: Чисто'],
            [40.294797, 69.594224, 'c', 'Статус: Чисто'],
            [40.295714, 69.592587, 'c', 'Статус: Чисто'],
            [40.291217, 69.595520, 'c', 'Статус: Чисто'],
            [40.298079, 69.598126, 'c', 'Статус: Чисто'],
            [40.298875, 69.600408, 'u', ''],
            [40.299935, 69.603779, 'u', ''],
            [40.293488, 69.591899, 'c', 'Статус: Чисто'],
            [40.293580, 69.597363, 'u', ''],
            [40.293501, 69.597172, 'u', ''],
            [40.291407, 69.596333, 'u', ''],
            [40.290115, 69.591836, 'c', 'Статус: Чисто'],
            [40.290301, 69.592194, 'u', ''],
            [40.296212, 69.610370, 'u', ''],
            [40.297263, 69.613332, 'u', ''],
            [40.297303, 69.613455, 'u', ''],
            [40.297960, 69.615260, 'u', ''],
            [40.297091, 69.615816, 'u', ''],
            [40.296065, 69.616349, 'c', ''],
            [40.295661, 69.616685, 'u', ''],
            [40.294912, 69.617156, 'u', ''],
            [40.294285, 69.617172, 'u', ''],
            [40.294182, 69.617235, 'u', ''],
            [40.291248, 69.619102, 'u', ''],
            [40.287761, 69.618199, 'u', ''],
            [40.285293, 69.618650, 'u', ''],
            [40.285131, 69.618612, 'u', ''],
            [40.285541, 69.620910, 'u', ''],
            [40.285599, 69.621183, 'u', ''],
            [40.284216, 69.616086, 'u', ''],
            [40.300167, 69.632497, 'c', 'Статус: Чисто'],
            [40.300200, 69.603449, 'u', ''],
            [40.285280, 69.623239, 'c', 'Статус: Чисто'],
            [40.285196, 69.622087, 'u', ''],
            [40.285141, 69.621830, 'u', ''],
            [40.276337, 69.609382, 'c', 'Статус: Чисто'],
            [40.278314, 69.613180, 'c', 'Статус: Чисто'],
            [40.277596, 69.611914, 'u', ''],
            [40.295089, 69.619780, 'u', ''],
        ];

        POINTS.forEach(([lat, lng, type, note]) => {
            const t = TYPES[type];
            L.circleMarker([lat, lng], t.style).addTo(map).bindPopup(() => {
                const el = document.createElement('div');
                el.innerHTML = `<b>${t.title}</b>` + (note ? `<br>${note}` : '') + '<br>';
                const btn = document.createElement('button');
                btn.className = 'route-btn';
                btn.textContent = 'Маршрут 🚶‍♂️';
                btn.addEventListener('click', () => buildRoute(lat, lng));
                el.appendChild(btn);
                return el;
            });
        });

        let userLocation = null;
        let userMarker = null;
        let routingControl = null;

        function requestLocation() {
            if (!navigator.geolocation) {
                notify("Геолокация не поддерживается вашим устройством/браузером.");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLocation = [pos.coords.latitude, pos.coords.longitude];
                    map.setView(userLocation, 16);
                    if (userMarker) {
                        userMarker.setLatLng(userLocation);
                    } else {
                        userMarker = L.circleMarker(userLocation, {
                            radius: 8, fillColor: "#E91E63", color: "#ffffff",
                            weight: 2, opacity: 1, fillOpacity: 0.9
                        }).addTo(map).bindPopup("<b>Вы здесь</b>");
                    }
                    userMarker.openPopup();
                },
                () => notify("Не удалось определить местоположение."),
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function buildRoute(destLat, destLng) {
            if (!userLocation) {
                notify("Сначала укажите ваше местоположение (кнопка 📍 Где я?)");
                requestLocation();
                return;
            }
            map.closePopup();
            if (routingControl) map.removeControl(routingControl);

            routingControl = L.Routing.control({
                waypoints: [L.latLng(userLocation[0], userLocation[1]), L.latLng(destLat, destLng)],
                // демо-сервер project-osrm.org умеет только авто, пешеходный маршрут — на сервере OSM
                router: L.Routing.osrmv1({
                    serviceUrl: 'https://routing.openstreetmap.de/routed-foot/route/v1',
                    profile: 'foot'
                }),
                lineOptions: { styles: [{ color: '#4CAF50', opacity: 0.8, weight: 6 }] },
                addWaypoints: false,
                draggableWaypoints: false,
                fitSelectedRoutes: true,
                showAlternatives: false
            }).addTo(map);
        }

        // ---------- профиль
        async function loadProfile() {
            document.getElementById('user-name').innerText = userName;

            const avatar = document.getElementById('avatarBox');
            if (tgUser?.photo_url) {
                const img = document.createElement('img');
                img.src = tgUser.photo_url;
                img.className = 'avatar-img';
                img.alt = 'Avatar';
                avatar.replaceChildren(img);
            } else {
                avatar.innerText = userName.replace('@', '').charAt(0).toUpperCase();
            }

            if (!tgUser) return; // открыто не из Telegram

            try {
                const res = await fetch(`${SERVER_URL}/api/user/${tgUser.id}`);
                if (!res.ok) throw new Error(res.status);
                const data = await res.json();
                const points = data.points || 0;

                const rank = RANKS.find(r => points < r.max) || RANKS[RANKS.length - 1];
                const pct = Math.min(100, Math.round((points / rank.max) * 100));

                document.getElementById('user-points').innerText = points;
                document.getElementById('reports-count').innerText = data.reports_count || 0;
                document.getElementById('rank-title').innerText = rank.name;
                document.getElementById('rank-progress-text').innerText = `${points} / ${rank.max} XP`;
                document.getElementById('rank-bar').style.width = `${pct}%`;
            } catch (e) {
                console.error("Ошибка загрузки профиля:", e);
            }
        }

        // ---------- отчёт
        // Уменьшаем фото до 1600px: быстрее грузится и проходит лимит сервера (10 МБ)
        function compressImage(file, maxSide = 1600, quality = 0.8) {
            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(b => resolve(b || file), 'image/jpeg', quality);
                };
                img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
                img.src = url;
            });
        }

        async function sendReport() {
            const fileInput = document.getElementById('photo-file');
            const actionSelect = document.getElementById('action-type');
            const commentInput = document.getElementById('report-comment');
            const submitBtn = document.getElementById('submit-btn');

            if (!initData) {
                notify("Откройте приложение через Telegram-бота.");
                return;
            }
            if (!fileInput.files[0]) {
                notify("Пожалуйста, прикрепите фотографию!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Отправка...";

            try {
                const opt = actionSelect.options[actionSelect.selectedIndex];
                const photo = await compressImage(fileInput.files[0]);

                const formData = new FormData();
                formData.append('init_data', initData);
                formData.append('username', userName);
                formData.append('action_type', opt.value);
                formData.append('points', opt.dataset.points);
                formData.append('comment', commentInput.value.trim());
                formData.append('photo', photo, 'photo.jpg');
                if (userLocation) {
                    formData.append('latitude', userLocation[0]);
                    formData.append('longitude', userLocation[1]);
                }

                const res = await fetch(`${SERVER_URL}/api/report`, { method: 'POST', body: formData });

                if (res.ok) {
                    notify("Отчёт успешно отправлен!");
                    fileInput.value = "";
                    commentInput.value = "";
                    switchTab('profile');
                } else {
                    let detail = res.statusText;
                    try { detail = (await res.json()).detail || detail; } catch (_) {}
                    notify(`Ошибка сервера (${res.status}): ${detail}`);
                }
            } catch (e) {
                notify(`Ошибка сети: ${e.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Отправить на проверку";
            }
        }

        requestLocation();
    </script>
</body>
</html>
