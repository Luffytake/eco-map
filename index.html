        // Координаты центра Худжанда

        // Инициализация карты
        const map = L.map('map').setView(khujandCoords, 14);

        // Подключаем бесплатные карты OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Стиль для обычных УЛИЧНЫХ УРН (Синие маленькие кружки)
        const urnStyle = {
            radius: 8,
            fillColor: "#0074D9", // Синий цвет
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.8
        };

        // Стиль для БОЛЬШИХ БАКОВ / КОНТЕЙНЕРОВ (Зеленые круги побольше)
        const containerStyle = {
            radius: 12,
            fillColor: "#2ECC40", // Зеленый цвет
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
        };

        // Включаем геолокацию пользователя (setView: false, чтобы карта не дергалась резко при запуске)
        map.locate({setView: false, maxZoom: 16});

        // Функция, если геолокация успешно найдена
        function onLocationFound(e) {
            // Создаем кастомную звезду вместо стандартной капли
            const starSvg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36">
                    <path fill="#FF4136" stroke="#ffffff" stroke-width="2" 
                    d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.857 1.4-8.168L.132 9.21l8.2-1.192z"/>
                </svg>
            `;

            const userIcon = L.divIcon({
                html: starSvg,
                className: 'user-star-marker',
                iconSize: [36, 36],
                iconAnchor: [18, 18]
            });

            // Ставим звезду на карту
            L.marker(e.latlng, {icon: userIcon}).addTo(map)
                .bindPopup("<b>Вы здесь! 📍</b>").openPopup();
        }
        map.on('locationfound', onLocationFound);

        // Если геолокацию определить не удалось
        function onLocationError(e) {
            console.log("Геолокация недоступна: " + e.message);
        }
        map.on('locationerror', onLocationError);
